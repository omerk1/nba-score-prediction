# NBA Score Prediction - Configuration

# Data paths
data_paths:
  raw_db: "data/raw/nba_api.sqlite"
  processed: "data/processed"
  features: "data/features"
  models: "data/models"

# Datasets loading
datasets_loading:
  data_start_date: "2016-10-01"        # Earliest data loaded for rolling-feature context
  train_start_date: "2018-10-16"       # First game actually used as a training sample
  train_end_date: "2024-04-14"         # End of 2023-24 regular season
  validation_start_date: "2024-10-22"  # Start of 2024-25 season
  validation_end_date: "2025-04-13"    # End of 2024-25 regular season
  test_start_date: "2025-10-21"        # Start of 2025-26 season
  test_end_date: "2026-04-12"          # End of 2025-26 regular season
  allowed_season_types:
    - "Regular Season"
  context_season_types:       # Season types loaded as warm-up context for val/test rolling features
    - "Regular Season"
    - "Playoffs"

# Feature engineering
features:
  rolling_windows: [5, 10, 20]   # Games for rolling averages (multiple windows)
  naive_rolling_baseline: 10    # Window used for the naive rolling-avg baseline comparison
  min_games_played: 5     # Minimum games for features
  h2h_margin_window: 3    # Meetings for H2H margin average
  h2h_win_rate_window: 5  # Meetings for H2H win rate
  targets:
    - "PTS_home"
    - "PTS_away"
  exclude:
    - "GAME_ID"
    - "GAME_DATE"
    - "SEASON_ID"
    - "SEASON_TYPE"
    - "HOME_TEAM_ID"
    - "AWAY_TEAM_ID"
    - "PTS_home"
    - "PTS_away"
    - "POINT_DIFF"
    - "TOTAL_POINTS"
    - "HOME_TEAM_WINS"
    - "matchup_key"
    - "FG_PCT_home"
    - "FG_PCT_away"
    - "FT_PCT_home"
    - "FT_PCT_away"
    - "FG3_PCT_home"
    - "FG3_PCT_away"
    - "AST_home"
    - "AST_away"
    - "REB_home"
    - "REB_away"
    - "FGM_home"
    - "FGM_away"
    - "FGA_home"
    - "FGA_away"
    - "FG3M_home"
    - "FG3M_away"
    - "FG3A_home"
    - "FG3A_away"
    - "FTM_home"
    - "FTM_away"
    - "FTA_home"
    - "FTA_away"

# Model parameters
model:
  random_state: 42
  iterations: 750              # Max boosting rounds; early stopping will use fewer
  early_stopping_rounds: 50    # Stop if val loss doesn't improve for this many rounds
  tuning:
    n_trials: 40
    depth:             [2, 8]       # Best consistently 5-8; [2,10] tried, didn't help (team_deficit_v2)
    learning_rate:     [0.005, 0.15]  # Top trials always <0.08; tightened upper
    l2_leaf_reg:       [1.0, 30.0]
    min_data_in_leaf:  [1, 50]     # Top trials clustered 15-26; extended upper
    subsample:         [0.5, 1.0]
    colsample_bylevel: [0.5, 1.0]
  
elo_features:
  enabled: true
  initial_rating: 1500.0    # Standard Elo starting point for all teams
  k_factor: 11.02           # Tuned via tune_elo.py (elo_param_search); 538 default was 20.0
  home_advantage: 117.87    # Tuned via tune_elo.py (elo_param_search); 538 default was 100.0
  mov_multiplier: true      # Margin-of-victory adjustment (538 formula)
  season_regression: 0.522  # Tuned via tune_elo.py (elo_param_search); 538 default was ~1/3 (0.33)
  tuning:
    n_trials: 30
    k_factor:           [5.0, 40.0]
    home_advantage:     [50.0, 150.0]
    season_regression:  [0.0, 0.75]

injury_features:
  enabled: true
  scorer: formula                           # formula (fast, no API) or llm (richer, needs GOOGLE_API_KEY)
  db_path: "data/raw/injury_features.sqlite"
  llm_model: "gemini-2.5-flash"
  api_calls_per_minute: 900         # Paid tier limit is 1000 RPM; staying 10% under
  parallel_workers: 5               # Concurrent LLM calls; keep below api_calls_per_minute/60 to avoid 503 bursts
  pdf_era_start: "2021-10-01"       # NBA official injury report PDFs available from 2021-22 season
  importance_weights:
    minutes_share: 0.4
    usage_rate: 0.4
    pts_share: 0.2
  severity_weights:
    severe: 1.0    # Surgery, fracture, tear, rupture, ACL
    moderate: 0.6  # Sprain, strain, bone bruise
    minor: 0.3     # Soreness, illness, injury recovery, unknown
  doubtful_weight: 0.8  # Fraction of Out severity applied to Doubtful players

style_matchup:
  # A7 module (src/matchups/), formally read by config_loader.py's Config schema
  # (StyleMatchupConfig) AND parsed directly (raw dict) by src/matchups/config.py.
  # See docs/a7_style_matchup_design.md and docs/a7_phase_log.md for how these
  # values were chosen.
  #
  # `enabled` gates feature_builder.py's _add_style_matchup_features (the
  # KNN-similarity style-matchup score). A real ablation-pipeline comparison
  # against baseline confirmed no real signal (style_matchup_score ranked ~29th
  # of 109 features, confidence had ~zero importance) -- NOT adopted, stays
  # `false`. See docs/a7_phase_log.md's KNN-Score Integration Test section.
  enabled: false
  # `raw_features_enabled` gates the SEPARATE, independently-toggleable
  # _add_style_fingerprint_features (raw per-team fingerprint components +
  # explicit home-vs-away differentials, mirroring _add_matchup_features's
  # pattern -- no KNN similarity search at all, unlike `enabled` above). A real
  # ablation-pipeline comparison against baseline found genuine signal
  # (away_style_pace_score/home_style_pace_score were the #1/#2 most important
  # features in the trained model) and a consistent total_mae improvement on
  # both val and test splits, at the cost of flat-to-slightly-worse
  # win_acc/brier -- ADOPTED as the new committed default: `true`. See
  # docs/a7_phase_log.md's Raw-Fingerprint Feature Redesign section.
  raw_features_enabled: true
  # Correction made during the KNN-score integration test:
  # fingerprint_window/decay_halflife/similarity_method/knn_k/
  # min_confidence_sample/full_confidence_sample below were the untuned Phase-0
  # defaults -- despite the design doc and phase log (Hyperparameter Search /
  # Post-Fix Hyperparameter Recheck sections) both documenting
  # window=37/halflife=13.2/knn/k=81/min_conf=21/full_conf=82 as the validated,
  # winning config, that config was never actually written into this yaml block
  # (src/matchups/tuning.py and walkforward.py's REFERENCE_METHODS hardcode it
  # separately as "wider_exploration_best" / "old_best_*" instead of reading it
  # from here). Corrected here so the precompute script (src/matchups/
  # precompute_scores.py) -- which reads this block via
  # src/matchups/config.py:load_style_matchup_config() -- actually uses the
  # validated config, per that run's explicit instruction not to re-tune.
  fingerprint_window: 37
  decay_halflife: 13.199390932957819
  # Halflife (consecutive qualifying team-games) for calibration.py's decay-weighted
  # injury-impact calibration -- see the injury_impact block below + this run's phase-log
  # section ("Decay-weighted injury-impact calibration") for the halflife grid explored
  # (5/10/20/40/10000-as-no-decay-reference) and why 20 was chosen.
  injury_calibration_decay_halflife_games: 20
  encoding: hand_picked
  similarity_method: knn   # cosine | knn -- knn wins once properly tuned, see phase log's Hyperparameter Search section
  similarity_threshold: 0.70   # unused when similarity_method=knn; kept for the cosine code path
  knn_k: 81
  min_confidence_sample: 21
  full_confidence_sample: 82
  low_confidence_fallback: h2h
  archetype_method: percentile
  injury_impact_calibrated: true  # values below are Phase-0 empirical deltas, not v1 guesses
  # Critique & Bug-Fix Pass recalibration: `combo` was redefined to use usage_rate +
  # assist-RATE (see archetype_percentiles.combo above) instead of raw ppg_pct/ast_pct,
  # which changes which players are classified combo vs. rim_protector/perimeter_specialist
  # (classify_archetypes() checks combo first) -- so all archetypes' calibration deltas
  # were re-derived against the new taxonomy. facilitator/scorer are numerically IDENTICAL
  # to the previous calibration (unaffected -- their definitions didn't change and their
  # populations don't overlap with combo). combo/rim_protector/perimeter_specialist shifted;
  # OLD (previous taxonomy) values kept here as a comment for traceability:
  #   combo:      pace_score=-1.1087, three_pt_reliance=-0.0047, paint_activity=0.0229,
  #               defensive_rating=0.2746, assist_rate=-0.0051  (n_without games not logged)
  #   rim_protector:        defensive_rating=0.5376, paint_activity=-0.2716 (n_without=3849)
  #   perimeter_specialist: defensive_rating=-0.3131 (n_without=407)
  # See docs/a7_phase_log.md's Critique & Bug-Fix Pass section for the full
  # old-vs-new comparison and the perimeter_specialist sign-flip investigation (sign
  # is UNCHANGED by this recalibration -- still negative -- but magnitude shrinks
  # substantially, from -0.3131 to -0.0889).
  #
  # Injury-Calibration Decay Fix: traced the -0.0889 sign flip almost entirely to
  # Collin Sexton's ~5-month continuous
  # ACL-recovery absence (127 of 680 qualifying perimeter_specialist event-rows) --
  # excluding his rows alone flips the sign to +0.9566. Rather than a hard cutoff on
  # absence length, calibration.py now down-weights each qualifying Out-event by an
  # exponential decay on its position within its continuous absence streak (1 = first
  # game of the absence, ...), halflife = injury_calibration_decay_halflife_games above
  # (=20), using the same weight = 0.5**(position/halflife) mechanism fingerprint.py's
  # rolling-window recency weighting already uses. All 5 archetypes' deltas below are now
  # DECAY-WEIGHTED (not just perimeter_specialist -- this is a general mechanism change).
  # PRE-DECAY (halflife=10000, i.e. no meaningful decay -- numerically ~= the previous
  # values above, small differences are box-score-cache refresh noise) values kept here
  # for traceability:
  #   facilitator: assist_rate=-0.0067, pace_score=-1.2744
  #   scorer:      three_pt_reliance=0.0236, paint_activity=0.3436
  #   combo:       pace_score=-0.5958, three_pt_reliance=-0.0038, paint_activity=0.0778,
  #                defensive_rating=0.5611, assist_rate=-0.0056
  #   rim_protector:        defensive_rating=0.4686, paint_activity=-0.28
  #   perimeter_specialist: defensive_rating=-0.0880 (SIGN FLIPPED positive by the fix below)
  # See docs/A7_PHASE_LOG.md "Decay-weighted injury-impact calibration" for the full
  # per-halflife table (5/10/20/40/10000) across every archetype and the Sexton/Porter
  # contribution-shrinkage numbers that justified halflife=20.
  injury_impact:
    facilitator:
      assist_rate: -0.0118
      pace_score: -2.16
    scorer:
      three_pt_reliance: 0.0139
      paint_activity: 0.3662
    combo:
      pace_score: -0.4059
      three_pt_reliance: -0.0026
      paint_activity: 0.0367
      defensive_rating: 0.5902
      assist_rate: -0.0048
    rim_protector:
      defensive_rating: 0.4281
      paint_activity: -0.2729
    perimeter_specialist:
      defensive_rating: 0.2948

on_off_splits:
  # Player on/off court splits. See docs/on_off_splits_decisions.md (phase 1 data
  # decisions, empirically tested against nba_api's TeamPlayerOnOffSummary) and
  # docs/on_off_splits_log.md (phase 2 implementation + validation).
  #
  # `enabled` gates feature_builder.py's _add_on_off_splits_features, mirroring
  # InjuryFeaturesConfig/StyleMatchupConfig's own `enabled` field. Same convention
  # as `style_matchup.enabled` above: a feature only flips to `true` after a
  # CONCLUSIVE ablation-pipeline comparison (compare `style_matchup.
  # raw_features_enabled` above, which earned `true` from a real, consistent
  # total_mae improvement across both val and test at full data coverage). This
  # feature has NOT cleared that bar yet -- docs/on_off_splits_log.md's real
  # MAE comparison (train_model.py, baseline vs treatment) was honestly
  # mixed/inconclusive (some metrics better, some worse, all within noise range),
  # and critically was run against only ~11% genuinely fresh backfill coverage
  # (most games either had zero on/off data or a stale value carried forward
  # from a checkpoint months earlier -- see the log's Backfill Run section). This
  # is pending (1) completing the full (non-partial) backfill across all
  # configured seasons, then (2) a conclusive ablation-pipeline result at that
  # full coverage, before being considered for adoption -- not "not decided yet."
  # Stays `false` until both of those happen.
  enabled: false
  db_path: "data/raw/player_on_off_splits.sqlite"
  # Checkpoint cadence for scripts/backfill_on_off_splits.py: TeamPlayerOnOffSummary
  # returns a season-cumulative-to-date number for whatever DateTo cutoff is passed,
  # so a fresh snapshot is only needed every `checkpoint_cadence_days`, not per game
  # (the value barely moves between two adjacent games at any point past the first
  # few weeks of a season) -- see the decisions doc's backfill-scope cost analysis.
  checkpoint_cadence_days: 7
  # Minimum minutes required on EACH side (on-court AND off-court independently,
  # not their sum) before a player's on_off_plus_minus is trusted enough to feed
  # the missing-player-impact feature -- guards against small-sample noise. Gating
  # on the sum alone is NOT enough: a rotation player can have hundreds of "on"
  # minutes and almost none "off" (rarely rested), which makes a combined total
  # look ample while the thin side alone is pure noise -- observed directly in
  # testing, a rookie with 620 on-minutes / 4 off-minutes produced a +150-point
  # on/off "swing" from a 4-minute sample. See feature_builder.py's
  # _add_on_off_splits_features docstring.
  min_on_off_minutes: 50.0
